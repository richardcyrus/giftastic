<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>GifTastic</title>
        <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark flex-md-nowrap p-0 shadow">
            <a class="navbar-brand col-md-2 mr-0" href="#">GifTastic</a>
        </nav>
        <div class="container-fluid">
            <div class="row flex-nowrap">
                <main role="main" class="col-10 px-4">
                    <div
                        class="d-flex flex-nowrap justify-content-between align-items-center pt-3 pb-2 mb-2 border-bottom">
                        <h1 class="h2">Click a topic button to see the images.</h1>
                    </div>
                    <div class="py-2 mb-2 border-bottom topic__set"></div>
                    <div class="d-none flex-nowrap mb-2 border-bottom topic__title-container">
                        <h1 class="topic__title h2"></h1>
                    </div>
                    <div class="card-columns image-set"></div>
                </main>
                <nav class="sidebar col-2">
                    <div class="sidebar-sticky">
                        <h6
                            class="sidebar-heading d-flex justify-content-between pt-3 align-items-center topic__form-title">
                            <span>Add Topic</span>
                        </h6>
                        <ul class="nav flex-column">
                            <li class="nav-item sidebar__form"></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
        <footer class="bg-dark py-4">
            <p class="text-center text-white m-0">Copyright &copy; 2018 Richard Cyrus</p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"
            integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
            integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
            integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
            crossorigin="anonymous"></script>
        <script type="text/javascript" src="assets/js/app.js"></script>
    </body>
</html>
